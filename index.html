<style>
/* Layout: instrument panel. Sticky header; phone = one column + bottom tab bar; desktop = right-side rail (RTL) + content. */
:root {
  --bg: #F2F5F4;
  --surface: #FFFFFF;
  --surface-2: #E9EFED;
  --ink: #0F1D1C;
  --ink-2: #455654;
  --muted: #6F807E;
  --line: #D3DCDA;
  --accent: #0A6A68;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEDEA;
  --opp: #17784A;
  --opp-soft: #DFF1E6;
  --risk: #B4372B;
  --risk-soft: #F8E2DE;
  --warn: #8F5B00;
  --warn-soft: #FBEFD6;
  --info-soft: #E3ECF7;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  --s5: #e87ba4;
  --neg: #e34948;
  --grid: #E1E6E4;
  --axis: #B9C4C1;
  --shadow: 0 1px 2px rgba(15, 29, 28, .06), 0 4px 16px rgba(15, 29, 28, .05);
  --f-display: "Secular One", "IBM Plex Sans Hebrew", system-ui, -apple-system, "Arial Hebrew", sans-serif;
  --f-body: "IBM Plex Sans Hebrew", system-ui, -apple-system, "Segoe UI", "Arial Hebrew", Arial, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px;
  --r-sm: 8px;
  --header-h: 56px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1211; --surface: #111C1B; --surface-2: #182624; --ink: #E2ECEA; --ink-2: #AFC1BE;
    --muted: #82948F; --line: #263533; --accent: #3DB5AF; --accent-ink: #04201E; --accent-soft: #143331;
    --opp: #43C283; --opp-soft: #12301F; --risk: #EE6D60; --risk-soft: #3A1915; --warn: #E6A93D;
    --warn-soft: #33270E; --info-soft: #172537;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --neg: #e66767; --grid: #22302E; --axis: #3A4A47;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1211; --surface: #111C1B; --surface-2: #182624; --ink: #E2ECEA; --ink-2: #AFC1BE;
  --muted: #82948F; --line: #263533; --accent: #3DB5AF; --accent-ink: #04201E; --accent-soft: #143331;
  --opp: #43C283; --opp-soft: #12301F; --risk: #EE6D60; --risk-soft: #3A1915; --warn: #E6A93D;
  --warn-soft: #33270E; --info-soft: #172537;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --neg: #e66767; --grid: #22302E; --axis: #3A4A47;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55;
  -webkit-tap-highlight-color: rgba(10, 106, 104, .15);
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface);
}
.app { direction: rtl; min-height: 100%; }
h1, h2, h3 { line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 1.75rem; letter-spacing: .01em; }
h2 { font-size: 1.08rem; font-weight: 700; }
h3 { font-size: .98rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num, .data { font-family: var(--f-data); font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: var(--header-h);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; text-decoration: none; color: inherit; }
.brand svg { flex: none; }
.brand-name { font-family: var(--f-data); font-weight: 600; font-size: 1rem; letter-spacing: .08em; direction: ltr; }
.brand-sub { font-size: .76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .76rem;
  border: 1px solid var(--line); color: var(--ink-2); background: var(--surface); white-space: nowrap;
}
.badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.badge.ok .dot { background: var(--opp); }
.badge.bad { color: var(--risk); border-color: var(--risk); }
.badge.bad .dot { background: var(--risk); }

/* ---------- banner + toast */
.banner {
  display: flex; gap: 10px; align-items: flex-start; justify-content: space-between;
  background: var(--risk-soft); color: var(--ink); border-bottom: 1px solid var(--risk);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-size: .9rem;
}
.banner button { flex: none; }
.toast {
  position: fixed; z-index: 40; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 12px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .9rem;
  transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- shell + nav */
.shell { display: block; }
main {
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 28px);
  max-width: 1180px; margin: 0 auto; min-width: 0;
}
.tabs {
  position: fixed; z-index: 25; inset: auto 0 0 0; display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.tab {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: var(--nav-h); padding: 6px 4px; text-decoration: none; color: var(--muted); font-size: .72rem; font-weight: 500;
  text-align: center; line-height: 1.2; cursor: pointer; touch-action: manipulation; position: relative;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"]::after {
  content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent);
}
body.kb .tabs { display: none; }
@media (min-width: 960px) {
  .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); align-items: start; }
  .tabs {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--header-h)); inset: auto; display: flex; flex-direction: column; gap: 4px;
    height: calc(100vh - var(--header-h)); border-top: 0; border-left: 1px solid var(--line); padding: 18px 12px;
  }
  .tab { flex-direction: row; justify-content: flex-start; gap: 12px; min-height: 46px; padding: 8px 14px; border-radius: var(--r-sm); font-size: .95rem; }
  .tab:hover { background: var(--surface-2); color: var(--ink); }
  .tab[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  .tab[aria-current="page"]::after { display: none; }
  main { padding-block: 26px 48px; }
  body.kb .tabs { display: flex; }
  .toast { bottom: 24px; }
}

/* ---------- views + common blocks */
.view { display: flex; flex-direction: column; gap: 18px; }
.view-head { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-family: var(--f-data); font-size: .72rem; letter-spacing: .14em; color: var(--accent); direction: ltr; text-align: right; }
.lede { color: var(--ink-2); max-width: 68ch; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 14px; min-width: 0;
}
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: 1fr; gap: 18px; }
@media (min-width: 760px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.empty {
  border: 1.5px dashed var(--line); border-radius: var(--r); padding: 18px; text-align: center; color: var(--ink-2);
  display: flex; flex-direction: column; gap: 10px; align-items: center;
}

/* ---------- buttons + fields */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px;
  border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: .92rem; cursor: pointer; touch-action: manipulation; text-decoration: none;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--risk); border-color: var(--risk); }
.btn.danger.armed { background: var(--risk); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: .85rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label, .lbl { font-size: .84rem; font-weight: 600; color: var(--ink-2); }
.field .hint { font-size: .78rem; color: var(--muted); }
.input, .select, .textarea {
  width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-sm);
  background: var(--bg); color: var(--ink); font-size: 16px;
}
.textarea { min-height: 120px; font-family: var(--f-data); font-size: 13px; direction: ltr; text-align: left; }
.input.numeric { direction: ltr; text-align: right; font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.input[aria-invalid="true"] { border-color: var(--risk); background: var(--risk-soft); }
.input:disabled { opacity: .75; }
.num-wrap { display: flex; align-items: stretch; gap: 6px; }
.num-wrap .input { flex: 1; min-width: 0; }
.unit { display: inline-flex; align-items: center; min-width: 30px; justify-content: center; color: var(--muted); font-size: .85rem; }
.pm { flex: none; width: 44px; min-height: 44px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); cursor: pointer; font-family: var(--f-data); font-size: 1rem; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.file-label { position: relative; overflow: hidden; }
.file-label input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; font-size: 0; }

/* ---------- chips / status */
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600;
  background: var(--surface-2); color: var(--ink-2); white-space: nowrap;
}
.chip svg { width: 13px; height: 13px; }
.chip.good { background: var(--opp-soft); color: var(--opp); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--risk-soft); color: var(--risk); }
.chip.info { background: var(--info-soft); color: var(--ink-2); }
.chip.demo { background: var(--warn-soft); color: var(--warn); border: 1px dashed var(--warn); }
.notes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-sm); font-size: .88rem; background: var(--info-soft); }
.note svg { flex: none; width: 18px; height: 18px; margin-top: 2px; }
.note.warn { background: var(--warn-soft); }
.note.warn svg { color: var(--warn); }
.note.error { background: var(--risk-soft); }
.note.error svg { color: var(--risk); }
.note.good { background: var(--opp-soft); }
.note.good svg { color: var(--opp); }
.note a { font-weight: 600; }

/* ---------- tables */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: var(--r-sm); }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .76rem; font-weight: 600; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: left; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }

/* ---------- scoring */
.score-strip {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--header-h)); z-index: 15;
  display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 8px; align-items: stretch;
  background: var(--bg); padding-block: 8px; margin-block: -8px 0;
}
.strip-cell { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px 10px; min-width: 0; }
.strip-cell .k { font-size: .7rem; color: var(--muted); white-space: nowrap; }
.strip-cell .v { font-family: var(--f-data); font-size: 1.25rem; font-weight: 600; line-height: 1.2; }
.strip-cell .v.opp { color: var(--opp); }
.strip-cell .v.risk { color: var(--risk); }
.strip-cell .d { font-weight: 700; font-size: .9rem; line-height: 1.25; }
.asset-bar { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 760px) { .asset-bar { grid-template-columns: minmax(0, 1.2fr) auto; align-items: end; } }
.asset-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.engine-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.engine-title small { display: block; font-family: var(--f-data); font-size: .74rem; color: var(--muted); letter-spacing: .06em; direction: ltr; text-align: right; }
.big-score { font-family: var(--f-data); font-size: 2.6rem; font-weight: 600; line-height: 1; text-align: left; direction: ltr; }
.big-score.opp { color: var(--opp); }
.big-score.risk { color: var(--risk); }
.big-score .of { font-size: .9rem; color: var(--muted); font-weight: 400; }
.cov { font-size: .8rem; color: var(--ink-2); text-align: left; }
.gauge { position: relative; height: 34px; direction: ltr; }
.gauge .track { position: absolute; left: 0; right: 0; top: 6px; height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.gauge .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; transition: width .25s; }
.gauge.opp .fill { background: var(--opp); }
.gauge.risk .fill { background: var(--risk); }
.gauge .th { position: absolute; top: 2px; width: 2px; height: 18px; background: var(--ink); }
.gauge .ticks { position: absolute; left: 0; right: 0; top: 19px; display: flex; justify-content: space-between; font-family: var(--f-data); font-size: .68rem; color: var(--muted); }
.comp { border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.comp > summary {
  list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center;
  padding: 10px 12px; min-height: 48px;
}
.comp > summary::-webkit-details-marker { display: none; }
.comp > summary .cname { font-weight: 600; }
.comp > summary .cw { font-family: var(--f-data); font-size: .76rem; color: var(--muted); }
.comp > summary .cs { font-family: var(--f-data); font-weight: 600; min-width: 3ch; text-align: left; }
.comp > summary::after { content: "▾"; color: var(--muted); font-size: .8rem; transition: transform .15s; grid-column: 3; grid-row: 1; justify-self: end; }
.comp[open] > summary::after { transform: rotate(180deg); }
.comp > summary .cs { grid-column: 2; }
.comp .cbody { border-top: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.comp.na { opacity: .7; }
.ind { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.ind-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.ind-top label { font-size: .86rem; font-weight: 600; }
.ind-out { font-family: var(--f-data); font-size: .8rem; color: var(--ink-2); white-space: nowrap; }
.ind .hint { font-size: .76rem; color: var(--muted); }
.scope { font-size: .68rem; font-weight: 600; padding: 1px 6px; border-radius: 4px; background: var(--info-soft); color: var(--ink-2); margin-inline-start: 6px; }
.na-toggle { display: flex; align-items: center; gap: 8px; font-size: .84rem; color: var(--ink-2); min-height: 36px; }
.na-toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.breakdown td .bar { height: 6px; border-radius: 3px; background: var(--surface-2); position: relative; min-width: 60px; direction: ltr; }
.breakdown td .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.engine.opp .breakdown td .bar i { background: var(--opp); }
.engine.risk .breakdown td .bar i { background: var(--risk); }
.decision { display: flex; flex-direction: column; gap: 10px; }
.decision-label { font-family: var(--f-display); font-size: 1.6rem; line-height: 1.15; }
.decision.good .decision-label { color: var(--opp); }
.decision.warn .decision-label { color: var(--warn); }
.decision.bad .decision-label { color: var(--risk); }
.matrix-wrap { width: 100%; max-width: 440px; margin-inline: auto; }
.matrix-wrap svg { width: 100%; height: auto; display: block; }
.fusion-grid { display: grid; gap: 18px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .fusion-grid { grid-template-columns: 1fr 1fr; align-items: center; } }
.disclaimer { font-size: .78rem; color: var(--muted); }

/* ---------- charts */
.chart { position: relative; width: 100%; touch-action: pan-y; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .tip {
  position: absolute; pointer-events: none; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm);
  box-shadow: var(--shadow); padding: 8px 10px; font-size: .78rem; min-width: 170px; direction: rtl;
}
.chart .tip .t { font-family: var(--f-data); color: var(--muted); margin-bottom: 4px; direction: ltr; text-align: right; }
.chart .tip .r { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 3px; border-radius: 2px; display: inline-block; flex: none; }

<script>
(function () {
  'use strict';

  /* =====================================================================
     0. Small utilities
     ===================================================================== */
  var DOC = document;
  try { DOC.documentElement.lang = 'he'; DOC.documentElement.dir = 'rtl'; } catch (e) { /* ignore */ }

  function $(sel, r) { return (r || DOC).querySelector(sel); }
  function $$(sel, r) { return Array.prototype.slice.call((r || DOC).querySelectorAll(sel)); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function isNum(x) { return typeof x === 'number' && isFinite(x); }
  function avg(a) { return a.length ? a.reduce(function (s, x) { return s + x; }, 0) / a.length : null; }
  function uid() { return Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4); }
  function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function isoUTC(t) { var d = new Date(t); return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()); }
  function todayISO() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function daysBetweenISO(a, b) {
    var ta = Date.parse(a + 'T00:00:00Z'), tb = Date.parse(b + 'T00:00:00Z');
    if (!isFinite(ta) || !isFinite(tb)) return null;
    return Math.round((tb - ta) / 86400000);
  }
  var LRM = '‎';

  function makeNF(opts) { try { return new Intl.NumberFormat('he-IL', opts); } catch (e) { return new Intl.NumberFormat('en-US', opts); } }
  var NF = { 0: makeNF({ maximumFractionDigits: 0 }), 1: makeNF({ maximumFractionDigits: 1 }), 2: makeNF({ maximumFractionDigits: 2 }) };
  function fmt(x, d) { if (!isNum(x)) return '—'; return NF[d == null ? 1 : d].format(x); }
  /* signed values get a left-to-right mark so "+12%" does not render as "12%+" inside Hebrew text */
  function fmtSigned(x, d) { if (!isNum(x)) return '—'; return '‎' + (x > 0 ? '+' : '') + fmt(x, d); }
  function fmtPct(x, d) { if (!isNum(x)) return '—'; return '‎' + fmt(x, d == null ? 1 : d) + '%'; }
  function fmtPctSigned(x, d) { if (!isNum(x)) return '—'; return '‎' + (x > 0 ? '+' : '') + fmt(x, d == null ? 1 : d) + '%'; }
  function fmtCompact(x) {
    if (!isNum(x)) return '—';
    var a = Math.abs(x);
    if (a >= 1e6) return (x / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/, '') + 'M';
    if (a >= 1e3) return (x / 1e3).toFixed(a >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'K';
    return fmt(x, 0);
  }
  function fmtMoney(x, cur) {
    if (!isNum(x)) return '—';
    try { return new Intl.NumberFormat('he-IL', { style: 'currency', currency: cur || 'USD', maximumFractionDigits: 0 }).format(x); }
    catch (e) { return fmt(x, 0); }
  }
  function fmtDate(iso) { if (!iso) return '—'; var p = iso.split('-'); return p.length === 3 ? (+p[2]) + '.' + (+p[1]) + '.' + p[0] : iso; }

  /* Parse a number typed by a person: accepts "," or "." decimals, %, ₪, $, Unicode minus. NaN = invalid, null = empty. */
  function parseNum(raw) {
    if (raw == null) return null;
    var s = String(raw).trim();
    if (!s) return null;
    s = s.replace(/[‎‏‪-‮\s%₪$]/g, '').replace(/[−–]/g, '-');
    if (!s) return null;
    if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) s = s.replace(/,/g, '');
    else if (/^[-+]?\d{1,3}(,\d{3})+$/.test(s)) s = s.replace(/,/g, '');
    else if (s.indexOf(',') >= 0) s = s.replace(',', '.');
    if (!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
    return parseFloat(s);
  }

  /* =====================================================================
     1. Safe storage (never throws; works when blocked by a sandbox)
     ===================================================================== */
  var STORAGE_KEY = 'qd-fusion:v1';
  var Store = {
    available: false, lastResult: null,
    probe: function () {
      try {
        var k = '__qd_probe__';
        window.localStorage.setItem(k, '1');
        window.localStorage.removeItem(k);
        this.available = true;
      } catch (e) { this.available = false; }
      return this.available;
    },
    load: function () {
      if (!this.available) return null;
      try { var raw = window.localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }
      catch (e) { return null; }
    },
    save: function (st) {
      if (!this.available) { this.lastResult = 'unavailable'; return this.lastResult; }
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify(st));
        this.lastResult = 'ok';
      } catch (e) {
        try {
          var slim = deepCopy(st);
          if (slim.backtest) { slim.backtest.files = { prices: null, vix: null, scores: null }; slim.backtest.csvDropped = true; }
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(slim));
          this.lastResult = 'partial';
        } catch (e2) { this.lastResult = 'failed'; }
      }
      return this.lastResult;
    }
  };

  /* =====================================================================
     2. Model configuration
     Each indicator is mapped linearly to 0–100: value at `from` = 0 points, value at `to` = 100 points (clamped).
     ===================================================================== */
  var IND = {
    pe_current:    { label: 'מכפיל רווח צפוי (Forward P/E)', unit: 'x', scope: 'asset', neg: false, hint: 'מחיר חלקי רווח למניה צפוי ל-12 חודשים.' },
    pe_median:     { label: 'חציון מכפיל רווח, 10 שנים', unit: 'x', scope: 'asset', neg: false, hint: 'החציון ההיסטורי של אותו מכפיל.' },
    fcf_yield:     { label: 'תשואת תזרים חופשי (FCF Yield)', unit: '%', scope: 'asset', neg: true, hint: 'תזרים חופשי שנתי חלקי שווי שוק.' },
    eps_growth:    { label: 'צמיחת EPS צפויה, 12 חודשים', unit: '%', scope: 'asset', neg: true, hint: 'צמיחת הרווח למניה שהאנליסטים צופים.' },
    eps_rev3m:     { label: 'שינוי בתחזית ה-EPS ב-3 חודשים', unit: '%', scope: 'asset', neg: true, hint: 'כמה תחזית הרווח עודכנה למעלה או למטה.' },
    drawdown:      { label: 'מרחק מהשיא של 52 שבועות', unit: '%', scope: 'asset', neg: true, hint: 'מספר שלילי, למשל ‎-25 לירידה של 25%.' },
    eps_since_peak:{ label: 'שינוי בתחזית ה-EPS מאז שיא המחיר', unit: '%', scope: 'asset', neg: true, hint: 'אם המחיר ירד והתחזית כמעט לא זזה, הפחד לא מגובה ביסודות.' },
    px_vs_200:     { label: 'מחיר מול ממוצע 200 יום', unit: '%', scope: 'asset', neg: true, hint: 'אחוז מעל (+) או מתחת (−) לממוצע הנע.' },
    mom_3m:        { label: 'תשואת מחיר ב-3 חודשים', unit: '%', scope: 'asset', neg: true, hint: '' },
    roic:          { label: 'תשואה על ההון המושקע (ROIC)', unit: '%', scope: 'asset', neg: true, hint: '' },
    nd_ebitda:     { label: 'חוב נטו / EBITDA', unit: 'x', scope: 'asset', neg: true, hint: 'שלילי = מזומן נטו.' },
    weight_pf:     { label: 'משקל הנכס בתיק', unit: '%', scope: 'asset', neg: false, hint: 'מחושב אוטומטית אם הסימול קיים בתיק איתמר 2040.' },
    vix:           { label: 'מדד VIX', unit: '', scope: 'market', neg: false, hint: 'מדד התנודתיות של S&P 500.' },
    hy_oas:        { label: 'מרווח אג"ח High Yield ‏(OAS)', unit: '%', scope: 'market', neg: false, hint: 'לדוגמה סדרת BAMLH0A0HYM2 ב-FRED.' },
    hy_oas_chg:    { label: 'שינוי במרווח HY ב-3 חודשים', unit: 'נ"ב', scope: 'market', neg: true, hint: 'בנקודות בסיס. עלייה = הידוק אשראי.' },
    curve:         { label: 'מרווח תשואות 10 שנים פחות 3 חודשים', unit: '%', scope: 'market', neg: true, hint: 'שלילי = עקום הפוך.' }
  };
  var DERIVED = {
    pe_rel: { label: 'מכפיל נוכחי ביחס לחציון', unit: 'x', inputs: ['pe_current', 'pe_median'] }
  };
  var MARKET_KEYS = ['vix', 'hy_oas', 'hy_oas_chg', 'curve'];

  var ENGINES = {
    opp: {
      name: 'QD Opportunity', title: 'מנוע הזדמנות', tone: 'opp',
      components: [
        { id: 'valuation', name: 'תמחור', w: 25, items: [{ src: 'pe_rel', from: 1.3, to: 0.7 }, { src: 'fcf_yield', from: 1, to: 7 }] },
        { id: 'earnings', name: 'רווחים', w: 25, items: [{ src: 'eps_growth', from: -10, to: 20 }, { src: 'eps_rev3m', from: -5, to: 5 }] },
        { id: 'divergence', name: 'פער פחד–יסודות', w: 20, kind: 'divergence', items: [
          { src: 'drawdown', from: 0, to: -40, role: 'fear' }, { src: 'vix', from: 12, to: 40, role: 'fear' },
          { src: 'eps_since_peak', from: -20, to: 0, role: 'fund' }] },
        { id: 'trend', name: 'מגמה', w: 15, items: [{ src: 'px_vs_200', from: -15, to: 10 }, { src: 'mom_3m', from: -15, to: 10 }] },
        { id: 'quality', name: 'איכות העסק', w: 15, items: [{ src: 'roic', from: 5, to: 25 }, { src: 'nd_ebitda', from: 4, to: 0 }] }
      ]
    },
    risk: {
      name: 'QD Risk', title: 'מנוע סיכון', tone: 'risk',
      components: [
        { id: 'credit', name: 'אשראי ונזילות', w: 25, items: [{ src: 'hy_oas', from: 3, to: 8 }, { src: 'hy_oas_chg', from: 0, to: 150 }] },
        { id: 'earnDet', name: 'הידרדרות ברווחים', w: 25, items: [{ src: 'eps_rev3m', from: 3, to: -10 }, { src: 'eps_growth', from: 10, to: -15 }] },
        { id: 'valRisk', name: 'סיכון תמחור', w: 15, items: [{ src: 'pe_rel', from: 0.9, to: 1.4 }, { src: 'fcf_yield', from: 6, to: 1 }] },
        { id: 'tech', name: 'שבירה טכנית', w: 15, items: [{ src: 'px_vs_200', from: 5, to: -15 }, { src: 'mom_3m', from: 5, to: -20 }] },
        { id: 'systemic', name: 'לחץ מערכתי', w: 15, items: [{ src: 'vix', from: 15, to: 40 }, { src: 'curve', from: 1, to: -1 }] },
        { id: 'conc', name: 'ריכוזיות בתיק', w: 5, items: [{ src: 'weight_pf', from: 5, to: 25 }] }
      ]
    }
  };
  var ASSET_TYPES = { stock: 'מניה', etf: 'קרן סל (ETF)', commodity: 'סחורה (זהב, כסף)', index: 'מדד', other: 'אחר' };
  var NA_PRESETS = { commodity: { opp: ['valuation', 'earnings', 'divergence', 'quality'], risk: ['earnDet', 'valRisk'] } };
  var HOLDING_CLASSES = { us_eq: 'מניות ארה"ב', world_eq: 'מניות עולם', bonds: 'אג"ח', metals: 'מתכות יקרות', cash: 'מזומן', other: 'אחר' };

  function labelOf(src) { return (IND[src] || DERIVED[src] || { label: src }).label; }
  function unitOf(src) { return (IND[src] || DERIVED[src] || { unit: '' }).unit; }

  /* =====================================================================
     3. Scoring engines (pure functions)
     ===================================================================== */
  function mapLin(x, from, to) {
    if (!isNum(x) || from === to) return null;
    return clamp((x - from) / (to - from), 0, 1) * 100;
  }

  function scoreEngine(engKey, vals, na) {
    var eng = ENGINES[engKey];
    var naSet = (na && na[engKey]) || [];
    var comps = [], warnings = [];
    var wCovered = 0, wApplicable = 0, acc = 0, covered = 0, applicable = 0;

    eng.components.forEach(function (c) {
      var isNA = naSet.indexOf(c.id) >= 0;
      var items = c.items.map(function (it) {
        var v = vals[it.src];
        var value = isNum(v) ? v : null;
        var sc;
        if (c.kind === 'divergence' && it.role === 'fund') sc = value == null ? null : clamp((value - it.from) / (it.to - it.from), 0, 1);
        else sc = mapLin(value, it.from, it.to);
        return { src: it.src, from: it.from, to: it.to, role: it.role || null, value: value, score: sc };
      });
      var score = null, status, note = '', missing = [];
      if (isNA) {
        status = 'na';
      } else if (c.kind === 'divergence') {
        var fear = items.filter(function (i) { return i.role === 'fear' && i.score != null; });
        var fund = items.filter(function (i) { return i.role === 'fund'; })[0];
        items.forEach(function (i) { if (i.value == null) missing.push(labelOf(i.src)); });
        if (!fear.length || fund.score == null) {
          status = 'missing';
          var why = [];
          if (!fear.length) why.push('מדד פחד (מרחק מהשיא או VIX)');
          if (fund.score == null) why.push('שינוי בתחזית ה-EPS מאז השיא');
          note = 'חסר: ' + why.join(' ו') + '. בלי שני הצדדים אי אפשר למדוד פער.';
        } else {
          var fearAvg = avg(fear.map(function (i) { return i.score; }));
          score = fearAvg * fund.score;
          status = fear.length < 2 ? 'partial' : 'ok';
          note = 'עוצמת פחד ' + fmt(fearAvg, 0) + ' × מקדם יסודות ' + fmt(fund.score, 2) + ' = ' + fmt(score, 0);
        }
      } else {
        var have = items.filter(function (i) { return i.score != null; });
        items.forEach(function (i) { if (i.score == null) missing.push(labelOf(i.src)); });
        if (!have.length) status = 'missing';
        else { score = avg(have.map(function (i) { return i.score; })); status = have.length < items.length ? 'partial' : 'ok'; }
      }
      if (!isNA) {
        wApplicable += c.w; applicable++;
        if (score != null) { wCovered += c.w; acc += c.w * score; covered++; }
      }
      comps.push({ id: c.id, name: c.name, w: c.w, kind: c.kind || null, items: items, score: score, status: status, note: note, missing: missing });
    });

    var total = wCovered > 0 ? acc / wCovered : null;
    comps.forEach(function (c) {
      c.effW = (c.score != null && wCovered > 0) ? c.w / wCovered * 100 : 0;
      c.contrib = c.score != null ? c.effW * c.score / 100 : 0;
    });
    var coverage = wApplicable > 0 ? wCovered / wApplicable : 0;
    var reliable = total != null && coverage >= 0.6 && covered >= 2;

    if (applicable === 0) warnings.push({ level: 'error', text: 'כל הרכיבים סומנו כלא רלוונטיים, ולכן אין ציון.' });
    else if (total == null) warnings.push({ level: 'error', text: 'אין אף נתון למנוע הזה. הזן לפחות שני רכיבים כדי לקבל ציון.' });
    else if (!reliable) {

      else if (act === 'copy-log' || act === 'dl-log') {
        var aa = activeAsset(); if (!aa) return;
        var rows = state.scoreLog.filter(function (x) { return x.assetId === aa.id; });
        if (!rows.length) { toast('אין עדיין ציונים מתועדים לנכס הזה'); return; }
        var csv = logToCSV(rows), fname = 'qd-scores-' + (aa.ticker || 'asset') + '-' + todayISO() + '.csv';
        if (act === 'copy-log') copyText(csv, 'היומן הועתק', $('#logOut', sec)); else downloadText(csv, fname, 'text/csv');
      }
      else if (act === 'del-asset') {
        armOrRun(b, function () {
          var a = activeAsset(); if (!a) return;
          state.assets = state.assets.filter(function (x) { return x.id !== a.id; });
          state.activeAssetId = state.assets.length ? state.assets[0].id : null;
          persist(); RENDER.scoring(sec); toast('הנכס נמחק');
        }, 'לחץ שוב כדי למחוק');
      }
    });
    sec.addEventListener('submit', function (e) {
      if (e.target.id !== 'addAssetForm') return;
      e.preventDefault();
      var name = $('#newName', sec).value.trim();
      if (!name) { $('#newName', sec).setAttribute('aria-invalid', 'true'); $('#newName', sec).focus(); toast('צריך לתת לנכס שם'); return; }
      var type = $('#newType', sec).value;
      var preset = NA_PRESETS[type] || { opp: [], risk: [] };
      var asset = { id: uid(), name: name, ticker: $('#newTicker', sec).value.trim().toUpperCase(), type: type, demo: false, asOf: todayISO(),
        na: { opp: preset.opp.slice(), risk: preset.risk.slice() }, inputs: {} };
      state.assets.push(asset); state.activeAssetId = asset.id;
      persist(); RENDER.scoring(sec); toast('הנכס נוסף');
    });
  }

  function gaugeHTML(key, score) {
    var th = key === 'opp' ? state.settings.oppHi : state.settings.riskHi;
    var w = isNum(score) ? clamp(score, 0, 100) : 0;
    return '<div class="track"><div class="fill" style="width:' + w + '%"></div></div>' +
      '<div class="th" style="left:calc(' + th + '% - 1px)" title="סף ' + th + '"></div>' +
      '<div class="ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>';
  }

  function refreshScoring() {
    var sec = $('#view-scoring'), a = activeAsset();
    if (!sec || !a) return;
    var S = scoreAsset(a);
    function out(name) { return $('[data-out="' + name + '"]', sec); }
    ['o', 'r'].forEach(function (k) {
      var key = k === 'o' ? 'opp' : 'risk', res = S[k];
      var el = out('score-' + key); if (el) el.textContent = res.score == null ? '—' : fmt(res.score, 0);
      var cov = out('cov-' + key);
      if (cov) cov.innerHTML = 'כיסוי נתונים ' + fmtPct(res.coverage * 100, 0) + (res.score != null && !res.reliable ? ' · <strong style="color:var(--risk)">לא אמין</strong>' : '');
      var g = out('gauge-' + key); if (g) g.innerHTML = gaugeHTML(key, res.score);
      var w = out('warn-' + key);
      if (w) w.innerHTML = res.warnings.length ? res.warnings.map(function (x) { return noteHTML(x.level, esc(x.text)); }).join('') : noteHTML('good', 'כל הרכיבים מחושבים במלואם.');
      res.components.forEach(function (c) {
        var cid = key + '-' + c.id;
        var cs = out('cscore-' + cid); if (cs) cs.textContent = c.status === 'na' ? 'לא רלוונטי' : (c.score == null ? '—' : fmt(c.score, 0));
        var st = out('cstat-' + cid);
        if (st) st.innerHTML = c.status === 'missing' ? '<span class="chip warn">חסר</span>' : c.status === 'partial' ? '<span class="chip info">חלקי</span>' : '';
        c.items.forEach(function (it, idx) {
          var o = out('ind-' + cid + '-' + idx);
          if (!o) return;
          if (c.status === 'na') { o.textContent = ''; return; }
          var lbl = DERIVED[it.src] ? DERIVED[it.src].label + ': ' + (it.value == null ? '—' : fmt(it.value, 2) + 'x') + ' · ' : '';
          if (c.kind === 'divergence' && it.role === 'fund') o.textContent = lbl + 'מקדם יסודות: ' + (it.score == null ? 'אין נתון' : fmt(it.score, 2));
          else o.textContent = lbl + (it.score == null ? 'אין נתון, לא נכלל' : 'ציון מדד: ' + fmt(it.score, 0) + '/100');
        });
        var cn = out('cnote-' + cid); if (cn) cn.textContent = c.note;
      });
      var br = out('break-' + key);
      if (br) {
        br.innerHTML = '<table><thead><tr><th>רכיב</th><th class="num">משקל</th><th class="num">משקל בפועל</th><th class="num">ציון</th><th class="num">תרומה</th><th>מצב</th></tr></thead><tbody>' +
          res.components.map(function (c) {
            var stTxt = { ok: 'מלא', partial: 'חלקי', missing: 'חסר', na: 'לא רלוונטי' }[c.status];
            return '<tr><td>' + esc(c.name) + '</td><td class="num">' + c.w + '%</td><td class="num">' + (c.effW ? fmt(c.effW, 1) + '%' : '—') +
              '</td><td class="num">' + (c.score == null ? '—' : fmt(c.score, 0)) + '</td><td class="num">' + (c.score == null ? '—' : fmt(c.contrib, 1)) +
              '</td><td>' + stTxt + '</td></tr>';
          }).join('') + '</tbody></table>';
      }
    });
    var so = out('strip-opp'); if (so) so.textContent = S.o.score == null ? '—' : fmt(S.o.score, 0) + (S.o.reliable ? '' : '*');
    var sr = out('strip-risk'); if (sr) sr.textContent = S.r.score == null ? '—' : fmt(S.r.score, 0) + (S.r.reliable ? '' : '*');
    var sd = out('strip-dec');
    if (sd) { sd.textContent = S.d.label; sd.style.color = S.d.tone === 'good' ? 'var(--opp)' : S.d.tone === 'warn' ? 'var(--warn)' : S.d.tone === 'bad' ? 'var(--risk)' : 'var(--ink-2)'; }
    var dec = out('decision');
    if (dec) {
      dec.className = 'decision ' + (S.d.tone || '');
      dec.innerHTML = '<p class="muted small">' + esc(a.name) + (a.demo ? ' · ערכים מדומים' : '') + '</p><div class="decision-label">' + esc(S.d.label) + '</div><p>' + esc(S.d.text) + '</p>' +
        '<div class="row"><span class="chip good">הזדמנות ' + (S.o.score == null ? '—' : fmt(S.o.score, 0)) + '</span><span class="chip bad">סיכון ' + (S.r.score == null ? '—' : fmt(S.r.score, 0)) + '</span></div>';
    }
    var mx = out('matrix');
    if (mx) mx.innerHTML = matrixSVG([S], a.id);
  }

  /* Opportunity × Risk decision matrix (SVG). */
  function matrixSVG(list, activeId) {
    var W = 340, H = 320, L = 44, R = 12, T = 14, B = 44;
    var pw = W - L - R, ph = H - T - B;
    var oH = state.settings.oppHi, rH = state.settings.riskHi;
    function x(v) { return L + v / 100 * pw; }
    function y(v) { return T + (1 - v / 100) * ph; }
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="מטריצת החלטה: הזדמנות מול סיכון" direction="ltr" style="direction:ltr">';
    s += '<rect x="' + L + '" y="' + T + '" width="' + pw + '" height="' + ph + '" fill="var(--surface-2)" rx="6"/>';
    s += '<rect x="' + x(oH) + '" y="' + y(rH) + '" width="' + (x(100) - x(oH)) + '" height="' + (y(0) - y(rH)) + '" fill="var(--opp-soft)"/>';
    s += '<rect x="' + x(oH) + '" y="' + T + '" width="' + (x(100) - x(oH)) + '" height="' + (y(rH) - T) + '" fill="var(--warn-soft)"/>';
    s += '<rect x="' + L + '" y="' + T + '" width="' + (x(oH) - L) + '" height="' + (y(rH) - T) + '" fill="var(--risk-soft)"/>';
    s += '<line x1="' + x(oH) + '" x2="' + x(oH) + '" y1="' + T + '" y2="' + (T + ph) + '" stroke="var(--axis)" stroke-dasharray="4 3"/>';
    s += '<line x1="' + L + '" x2="' + (L + pw) + '" y1="' + y(rH) + '" y2="' + y(rH) + '" stroke="var(--axis)" stroke-dasharray="4 3"/>';
    var qf = 'font-size="11" font-weight="700" font-family="IBM Plex Sans Hebrew, system-ui, sans-serif"';
    s += '<text x="' + ((x(oH) + x(100)) / 2) + '" y="' + (y(0) - 8) + '" text-anchor="middle" fill="var(--opp)" ' + qf + '>קנייה מוגברת</text>';
    s += '<text x="' + ((x(oH) + x(100)) / 2) + '" y="' + (T + 16) + '" text-anchor="middle" fill="var(--warn)" ' + qf + '>קנייה מדורגת</text>';
    s += '<text x="' + ((L + x(oH)) / 2) + '" y="' + (T + 16) + '" text-anchor="middle" fill="var(--risk)" ' + qf + '>מצב הגנה</text>';
    s += '<text x="' + ((L + x(oH)) / 2) + '" y="' + (y(0) - 8) + '" text-anchor="middle" fill="var(--ink-2)" ' + qf + '>DCA רגיל</text>';
    [0, 25, 50, 75, 100].forEach(function (t) {
      s += '<text x="' + x(t) + '" y="' + (T + ph + 16) + '" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">' + t + '</text>';
      s += '<text x="' + (L - 6) + '" y="' + (y(t) + 3) + '" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">' + t + '</text>';
    });
    s += '<text x="' + (L + pw / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" fill="var(--ink-2)" font-family="IBM Plex Sans Hebrew, system-ui, sans-serif">ציון הזדמנות</text>';
    s += '<text transform="translate(12 ' + (T + ph / 2) + ') rotate(-90)" text-anchor="middle" font-size="11" fill="var(--ink-2)" font-family="IBM Plex Sans Hebrew, system-ui, sans-serif">ציון סיכון</text>';
    list.forEach(function (S) {
      if (S.o.score == null || S.r.score == null) return;
      var cx = x(clamp(S.o.score, 0, 100)), cy = y(clamp(S.r.score, 0, 100));
      var act = S.asset.id === activeId;
      var fill = S.o.reliable && S.r.reliable ? 'var(--ink)' : 'var(--surface)';
      s += '<g><title>' + esc(S.asset.name) + ': הזדמנות ' + fmt(S.o.score, 0) + ', סיכון ' + fmt(S.r.score, 0) + '</title>';
      s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (act ? 7 : 5.5) + '" fill="' + fill + '" stroke="var(--surface)" stroke-width="2"/>';
      if (!(S.o.reliable && S.r.reliable)) s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + (act ? 7 : 5.5) + '" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="2 2"/>';
      var lab = S.asset.ticker || S.asset.name;
      var anchor = cx > W - 80 ? 'end' : 'start';
      var lx = anchor === 'end' ? cx - 10 : cx + 10;
      s += '<text x="' + lx + '" y="' + (cy + 4) + '" text-anchor="' + anchor + '" font-size="11" font-weight="600" fill="var(--ink)" font-family="IBM Plex Sans Hebrew, system-ui, sans-serif" paint-order="stroke" stroke="var(--surface-2)" stroke-width="3">' + esc(lab) + '</text></g>';
    });
    return s + '</svg>';
  }

  /* =====================================================================
     10. Backtest view
     ===================================================================== */
  var BT = { parts: { prices: null, vix: null, scores: null }, ds: null, result: null, validation: null };
  var SLOTS = [
    { k: 'prices', label: 'מחירים', req: true, hint: 'date ו-close או Adj Close. רשות: open, dividend, split, vix ועמודות ציון.' },
    { k: 'vix', label: 'VIX', req: false, hint: 'date ו-vix (או close). לדוגמה VIXCLS מ-FRED.' },
    { k: 'scores', label: 'ציוני QD', req: false, hint: 'date, opp, opp_available, opp_coverage, risk, risk_available, risk_coverage, provenance.' }
  ];
  var TEMPLATES = {
    prices: 'date,open,close,adj_close,dividend,split,vix\n',
    vix: 'date,vix\n',
    scores: 'date,opp,opp_available,opp_coverage,risk,risk_available,risk_coverage,provenance\n'
  };
  function btRebuild() {
    var f = state.backtest.files || {};
    BT.parts.prices = f.prices ? parseTable(f.prices.text, 'prices') : null;
    BT.parts.vix = f.vix ? parseTable(f.vix.text, 'vix') : null;

    BT.ds = BT.parts.prices && !BT.parts.prices.errors.length
      ? buildDataset({ prices: BT.parts.prices, vix: BT.parts.vix, scores: BT.parts.scores, synthetic: !!state.backtest.synthetic }, state.backtest.params)
      : null;
    BT.result = null; BT.validation = null;
  }
  function btSetFile(slot, text, name, synthetic) {
    state.backtest.files = state.backtest.files || { prices: null, vix: null, scores: null };
    state.backtest.files[slot] = text == null ? null : { name: name || '', text: text };
    if (slot === 'prices') state.backtest.synthetic = !!synthetic && text != null;
    btRebuild();
    persist();
  }
  try { btRebuild(); } catch (e) { BT.ds = null; }

  RENDER.backtest = function (sec) {
    var p = state.backtest.params;
    var html = '<header class="view-head"><p class="eyebrow">BACKTEST</p><h1 id="h-backtest">בדיקה היסטורית</h1>' +
      '<p class="lede">טוענים נתונים ומשווים ארבע שיטות קנייה עם אותה הפקדה חודשית ואותם כללי ביצוע. האפליקציה לא מורידה נתונים ולא מאמתת אותם. כל מספר בתוצאות נגזר מהקבצים שטענת, והתוצאות הן סימולציה.</p></header>';
    html += dataCardHTML() + paramsCardHTML(p);
    html += '<section class="card" aria-labelledby="h-bt-res"><h2 id="h-bt-res">תוצאות הסימולציה</h2><div id="btResults"></div></section>';
    html += '<section class="card" aria-labelledby="h-bt-val"><h2 id="h-bt-val">תיקוף: רגישות ובדיקה מחוץ למדגם</h2>' +
      '<p class="muted small">ניתוח הרגישות מריץ את האסטרטגיות על רשת של ספים סביב הערכים שבחרת. בדיקת ה-walk-forward בוחרת ספים על 36 חודשים, בודקת אותם על 12 החודשים שאחריהם, ומתגלגלת קדימה. כל חלון בדיקה מתחיל מאפס, עם אותה הפקדה ל-DCA ולאסטרטגיה.</p>' +
      '<div class="row"><button type="button" class="btn" data-action="validate"' + (BT.ds && !BT.ds.errors.length ? '' : ' disabled') + '>הרץ תיקוף</button></div><div id="btValidation"></div></section>';
    sec.innerHTML = html;
    bindBacktest(sec);
    runAndRenderBacktest();
    if (BT.validation) renderValidation();
  };

  function dataCardHTML() {
    var f = state.backtest.files || {};
    var html = '<section class="card" aria-labelledby="h-bt-data"><h2 id="h-bt-data">נתונים</h2><div class="stack">';
    SLOTS.forEach(function (s) {
      var file = f[s.k], P = BT.parts[s.k];
      html += '<div class="slot"><div class="slot-head"><span class="lbl">' + s.label + ' <span class="muted">(' + (s.req ? 'חובה' : 'רשות') + ')</span></span>' +
        (file ? '<span class="chip ' + (P && P.errors.length ? 'bad' : 'info') + '">' + esc(file.name || 'טקסט') + '</span>' : '') + '</div>' +
        '<p class="muted small">' + s.hint + '</p><div class="row">' +
        '<label class="btn sm file-label">' + (file ? 'החלף קובץ' : 'בחר קובץ') + '<input type="file" data-slot="' + s.k + '" accept=".csv,text/csv,text/plain,.txt" aria-label="קובץ ' + s.label + '"></label>' +
        (file ? '<button type="button" class="btn sm ghost" data-action="clear-slot" data-slot="' + s.k + '">הסר</button>' : '') + '</div>' +
        (P ? fileIssuesHTML(P) : '') + '</div>';
    });
    html += '</div><div class="row"><button type="button" class="btn" data-action="synthetic">טען נתונים סינתטיים לבדיקה</button></div>' +
      '<details class="more"><summary>הדבקת קובץ מחירים כטקסט</summary><div class="stack"><label class="sr-only" for="csvPaste">טקסט CSV</label>' +
      '<textarea id="csvPaste" class="textarea" placeholder="date,close&#10;2020-01-02,100.5"></textarea>' +
      '<div class="row"><button type="button" class="btn" data-action="paste-csv">טען טקסט</button></div></div></details>' +
      '<details class="more"><summary>מבנה הקבצים ותבניות</summary><div class="stack small">' +
      '<p>המפרט המלא נמצא ב-docs/POINT_IN_TIME_SPEC.md שבחבילת הקוד. העיקר: לכל ציון QD צריך תאריך זמינות (opp_available, risk_available), כלומר היום שבו הציון היה ידוע בפועל, וכיסוי נתונים (0–1). ציון בלי תאריך זמינות לא ישמש להחלטות.</p>' +
      '<p>מחירים מותאמים (Adj Close) כבר כוללים דיבידנדים וספליטים, ולכן עמודות dividend ו-split מופעלות רק על מחירים גולמיים. במחירים של Yahoo, עמודת Close כבר מותאמת לספליטים: אל תוסיף לה עמודת split.</p>' +
      SLOTS.map(function (s) {
        return '<div class="stack"><span class="lbl">' + s.label + '</span><pre class="textarea" style="min-height:0;margin:0">' + esc(TEMPLATES[s.k].trim()) + '</pre>' +
          '<div class="row"><button type="button" class="btn sm" data-action="copy-tpl" data-slot="' + s.k + '">העתק</button><button type="button" class="btn sm" data-action="dl-tpl" data-slot="' + s.k + '">הורד</button></div></div>';
      }).join('') + '</div></details>';
    if (BT.ds) html += datasetSummaryHTML(BT.ds);
    return html + '</section>';
  }
  function kpi(k, v, s) { return '<div class="kpi"><span class="k">' + k + '</span><span class="v">' + v + '</span>' + (s ? '<span class="s">' + s + '</span>' : '') + '</div>'; }
  function fileIssuesHTML(P) {
    if (P.errors.length) return '<ul class="notes">' + P.errors.map(function (e) { return noteHTML('error', esc(e)); }).join('') + '</ul>';
    var h = '';
    if (P.warnings.length) h += '<ul class="notes">' + P.warnings.map(function (w) { return noteHTML('warn', esc(w)); }).join('') + '</ul>';
    if (P.issues.length) {
      h += '<details class="more"><summary>פירוט בעיות בשורות (' + P.issues.length + ')</summary><ul class="small" style="margin:0;padding-inline-start:20px">' +
        P.issues.slice(0, 50).map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') + (P.issues.length > 50 ? '<li>ועוד ' + (P.issues.length - 50) + '…</li>' : '') + '</ul></details>';
    }
    return h;
  }
  function datasetSummaryHTML(ds) {
    if (ds.errors.length) return '<ul class="notes">' + ds.errors.map(function (e) { return noteHTML('error', esc(e)); }).join('') + '</ul>';
    var b = ds.bars, m = ds.meta, P = BT.parts.prices;
    var basisSub = m.basis === 'adjusted' ? 'כולל דיבידנדים וספליטים' :
      (m.divsApplied ? m.divsApplied + ' דיבידנדים' : 'בלי דיבידנדים') + (m.splitsApplied ? ' · ' + m.splitsApplied + ' ספליטים' : '');
    var html = '<div class="kpis">' +
      kpi('שורות מחיר', fmt(b.length, 0), P && P.frequency ? P.frequency : '') +
      kpi('טווח', '<span class="data">' + fmtDate(b[0].ds) + '–' + fmtDate(b[b.length - 1].ds) + '</span>', monthStarts(b).length + ' חודשים') +
      kpi('בסיס מחיר', m.basis === 'adjusted' ? 'מותאם' : 'גולמי', basisSub) +
      kpi('VIX', m.vixSource === 'none' ? 'אין' : m.vixSource === 'file' ? 'קובץ נפרד' : 'בקובץ המחירים', m.openShare ? fmtPct(m.openShare * 100, 0) + ' עם מחיר פתיחה' : 'בלי מחיר פתיחה') + '</div>';
    html += '<h3>מקור הנתונים</h3><ul class="notes">' + provenanceNotes(ds).join('') + '</ul>';
    if (ds.warnings.length) html += '<ul class="notes">' + ds.warnings.map(function (w) { return noteHTML('warn', esc(w)); }).join('') + '</ul>';
    return html;
  }
  function provenanceNotes(ds) {
    var m = ds.meta, out = [];
    out.push(m.marketProv === 'synthetic'
      ? noteHTML('warn', '<b>נתוני שוק סינתטיים.</b> הסדרה נוצרה באקראי (זרע 2040), והיא לא מייצגת שום נכס או תקופה אמיתיים.')
      : noteHTML('info', '<b>נתוני שוק מיובאים.</b> האפליקציה לא בודקת את המקור או את נכונות המספרים. ודא שהקובץ הגיע ממקור היסטורי אמין.'));
    ['opp', 'risk'].forEach(function (k) {
      var mm = m[k], name = k === 'opp' ? 'ציוני הזדמנות' : 'ציוני סיכון';
      if (!mm || mm.pit === 'none') { out.push(noteHTML('info', '<b>' + name + ':</b> אין בנתונים.')); return; }
      var pv = mm.prov, parts = [];
      if (pv.recorded) parts.push(pv.recorded + ' נרשמו בזמן אמת');
      if (pv.reconstructed) parts.push(pv.reconstructed + ' שוחזרו בדיעבד');
      if (pv.synthetic) parts.push(pv.synthetic + ' סינתטיים');

        (mm.noCov ? ' ' + mm.noCov + ' בלי כיסוי נתונים.' : '')));

      paramField('maxWait', 'המתנה מרבית במזומן (חודשים)', p.maxWait, '', '0 מבטל את הכלל') + '</div>' +

  function rulesHTML() {

      '<li><b>זמנים:</b> ההחלטה מתקבלת בסגירת יום t, רק על סמך מידע שהיה זמין בסגירה הזאת. הביצוע ביום המסחר הבא, בפתיחה או בסגירה לפי הבחירה. הוראה שנוצרת ביום האחרון לא מתבצעת, והיא מוצגת כהוראה פתוחה.</li>' +
      '<li><b>הפקדה:</b> בסגירת יום המסחר הראשון של כל חודש, זהה לכל האסטרטגיות.</li>' +

      '<li><b>הזדמנות בלבד:</b> כמו VIX, אבל האות הוא ציון הזדמנות שזמין, טרי (לא עבר את הגיל המרבי) ובכיסוי מספיק.</li>' +
      '<li><b>QD FUSION:</b> וטו קודם לכול: כשציון הסיכון טרי וגבוה מסף הווטו או שווה לו, אין שום קנייה, גם לא אחרי המתנה מרבית. הווטו פועל גם על ציון בכיסוי נמוך, כי הוא בלם בטיחות. בלי וטו: הזדמנות גבוהה וסיכון נמוך: כל המזומן. הזדמנות גבוהה וסיכון גבוה: חצי מהמזומן, פעם בחודש. סיכון גבוה בלי הזדמנות: ממתינים. אחרת: ההפקדה החודשית בלבד. כשאין ציונים אמינים, קונים רק את ההפקדה החודשית, כמו DCA.</li>' +
      '<li><b>FUSION עם סיכון מקורב:</b> מופיעה רק אם סימנת אותה, ובשם נפרד. הסיכון מחושב מה-VIX (15 = 0, ‏40 = 100) ולא מציון QD.</li>' +

      '<li><b>עלויות:</b> עמלה = הגבוה מבין אחוז העמלה והעמלה המינימלית. החלקה מעלה את מחיר הקנייה. עלות ממוצעת כוללת את שתיהן.</li>' +
      '<li><b>אירועי חברה:</b> במחירים גולמיים, ספליט ואז דיבידנד בתחילת יום ה-ex. דיבידנד נכנס למזומן, אחרי מס אם הוגדר. במחירים מותאמים העמודות האלה לא מופעלות.</li>' +
      '<li><b>מדדים:</b> TWR מחושב לפי (שווי בסוף היום פחות הפקדה) חלקי שווי אתמול, כך שהפקדות לא נספרות כתשואה, ועמלות כן. XIRR לפי ימים בפועל חלקי 365, כמו ב-Excel.</li></ul>';

  function bindBacktest(sec) {
    if (sec.__bound) return;
    sec.__bound = true;
    var timer = null;
    function rerun(rebuild) {
      clearTimeout(timer);
      timer = setTimeout(function () {
        if (rebuild) { btRebuild(); RENDER.backtest(sec); return; }
        BT.validation = null;
        var v = $('#btValidation'); if (v) v.innerHTML = '';
        runAndRenderBacktest();
      }, 250);
    }
    sec.addEventListener('change', function (e) {
      var t = e.target, slot = t.getAttribute('data-slot');
      if (slot && t.type === 'file') {
        readFile(t.files && t.files[0], function (text, name) {
          btSetFile(slot, text, name, false);
          RENDER.backtest(sec);
          var P = BT.parts[slot];
          toast(P && P.errors.length ? 'הקובץ לא נטען. ראה פירוט.' : 'הקובץ נטען');
        });
        return;
      }
      var k = t.getAttribute('data-field');
      if (k === 'execAt') { state.backtest.params.execAt = t.value; persist(); rerun(false); }
      else if (k === 'priceBasis') { state.backtest.params.priceBasis = t.value; persist(); rerun(true); }
      else if (k === 'vixProxy') { state.backtest.params.vixProxy = t.checked; persist(); rerun(false); }
    });
    sec.addEventListener('input', function (e) {
      var t = e.target, k = t.getAttribute('data-field');
      if (!k || (NUM_PARAMS.indexOf(k) < 0 && k !== 'assumedLagDays')) return;
      var v = parseNum(t.value);
      if (k === 'assumedLagDays') {
        var okL = v === null || (isNum(v) && v >= 0 && v <= 3650);
        t.setAttribute('aria-invalid', okL ? 'false' : 'true');
        if (!okL) return;
        state.backtest.params.assumedLagDays = v; persist(); rerun(true);
        return;
      }
      var pctLike = ['oppTh', 'riskTh', 'riskVeto', 'minCoverage', 'divTaxPct'].indexOf(k) >= 0;
      var ok = isNum(v) && v >= 0 && !(k === 'monthly' && v <= 0) && !(pctLike && v > 100) && !(k === 'feePct' && v >= 100) && !(k === 'slippageBps' && v > 1000);
      t.setAttribute('aria-invalid', ok ? 'false' : 'true');
      if (!ok) return;
      state.backtest.params[k] = v; persist(); rerun(false);
    });
    sec.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-action]') : null;
      if (!b) return;
      var act = b.getAttribute('data-action'), slot = b.getAttribute('data-slot');
      if (act === 'synthetic') {
        state.backtest.files = { prices: null, vix: null, scores: null };
        btSetFile('prices', makeSyntheticCSV(2040), 'synthetic-2040.csv', true);
        RENDER.backtest(sec); toast('נטענו נתונים סינתטיים');
      } else if (act === 'clear-slot') { btSetFile(slot, null); RENDER.backtest(sec); }
      else if (act === 'paste-csv') {
        var txt = $('#csvPaste', sec).value;
        if (!txt.trim()) { toast('אין טקסט להדבקה'); return; }
        btSetFile('prices', txt, 'טקסט מודבק', false); RENDER.backtest(sec);
      }
      else if (act === 'copy-tpl') copyText(TEMPLATES[slot], 'התבנית הועתקה');
      else if (act === 'dl-tpl') downloadText(TEMPLATES[slot], 'qd-fusion-' + slot + '-template.csv', 'text/csv');
      else if (act === 'validate') runValidation();
    });
  }

    if ((m.opp && m.opp.prov.reconstructed) || (m.risk && m.risk.prov.reconstructed)) html += noteHTML('warn', 'חלק מהציונים שוחזרו בדיעבד. גם עם תאריכי זמינות, שחזור עלול לכלול מידע שלא היה ידוע אז, למשל דוחות מתוקנים.');
    html += '</ul>';
    html += '<p class="muted small">' + fmtDate(res.from) + ' עד ' + fmtDate(res.to) + ' · ' + res.months + ' הפקדות של ' + fmt(p.monthly, 0) +
      ' · אות בסגירה, ביצוע ב' + (p.execAt === 'open' ? 'פתיחת' : 'סגירת') + ' יום המסחר הבא' + (p.execAt === 'open' && m.openShare < 1 ? ' (בימים בלי מחיר פתיחה: בסגירה)' : '') +

      '<span><i class="sw dash"></i>סך ההפקדות</span></div><div class="chart" id="btChart"></div>';
    function nameCell(s) { return '<td><span class="sw" style="background:' + s.color + '"></span> ' + esc(s.name) + (s.proxy ? ' <span class="chip warn">קירוב</span>' : '') + '</td>'; }

      '<th class="num">ירידה מרבית</th><th class="num">חשיפה ממוצעת למזומן</th><th class="num">מחזור שנתי</th></tr></thead><tbody>' +
      on.map(function (s) {
        var x = s.metrics;
        return '<tr>' + nameCell(s) + '<td class="num data">' + fmt(x.finalValue, 0) + '</td><td class="num data">' + (x.xirr == null ? '—' : fmtPctSigned(x.xirr, 2)) +
          '</td><td class="num data">' + (x.twrCagr == null ? '—' : fmtPctSigned(x.twrCagr, 2)) + '</td><td class="num data">' + fmtPct(x.maxDD, 1) +

    html += '<h3>פעילות ועלויות</h3><div class="table-wrap"><table><thead><tr><th>אסטרטגיה</th><th class="num">קניות</th><th class="num">אחרי המתנה</th><th class="num">הפקדות תחת וטו</th>' +
      '<th class="num">עלות ממוצעת</th><th class="num">עמלות והחלקה</th><th class="num">דיבידנד נטו</th><th class="num">ריבית</th><th class="num">מזומן בסוף</th><th class="num">הוראה פתוחה</th></tr></thead><tbody>' +
      on.map(function (s) {
        var x = s.metrics;
        return '<tr>' + nameCell(s) + '<td class="num data">' + x.buys + '</td><td class="num data">' + x.fallbackBuys + '</td><td class="num data">' +

  function runValidation() {
    var box = $('#btValidation');
    if (!box || !BT.ds || BT.ds.errors.length) return;
    box.innerHTML = '<p class="muted">מחשב…</p>';
    setTimeout(function () {
      try {
        var p = state.backtest.params;
        BT.validation = { sens: sensitivity(BT.ds, p), wf: walkForward(BT.ds, p) };
        renderValidation();
      } catch (err) { box.innerHTML = '<ul class="notes">' + noteHTML('error', 'התיקוף נכשל: ' + esc(err.message)) + '</ul>'; }
    }, 30);
  }
  function heatCell(v, maxAbs, cur) {
    if (!isNum(v)) return '<td class="num data">—</td>';
    var a = maxAbs > 0 ? Math.min(1, Math.abs(v) / maxAbs) : 0;
    var col = v >= 0 ? 'var(--s1)' : 'var(--neg)';
    return '<td class="num data heat' + (cur ? ' cur' : '') + '" style="background:color-mix(in srgb, ' + col + ' ' + Math.round(a * 50) + '%, var(--surface))">' + fmtSigned(v, 2) + '</td>';
  }
  function renderValidation() {
    var box = $('#btValidation'), V = BT.validation;
    if (!box || !V) return;
    var s = V.sens, w = V.wf, html = '';
    if (BT.ds.meta.marketProv === 'synthetic') html += '<ul class="notes">' + noteHTML('warn', 'התיקוף רץ על נתונים סינתטיים. הוא מדגים את השיטה, ולא אומר דבר על ביצועים אמיתיים.') + '</ul>';
    html += '<h3>רגישות לספים</h3><p class="muted small">עודף XIRR מול DCA, בנקודות אחוז, על כל התקופה (DCA: ' + (s.dca == null ? '—' : fmtPct(s.dca, 2)) + '). התא המסומן הוא הבחירה הנוכחית. תוצאה טובה שמחזיקה רק בתא אחד, ולא בשכנים שלו, היא סימן להתאמת יתר.</p>';
    var all = [];
    if (s.fusion) s.fusion.forEach(function (r) { r.forEach(function (x) { if (isNum(x)) all.push(Math.abs(x)); }); });
    if (s.opp) s.opp.forEach(function (x) { if (isNum(x)) all.push(Math.abs(x)); });
    if (s.vix) s.vix.forEach(function (x) { if (isNum(x)) all.push(Math.abs(x)); });

  /* Line chart: value over time per strategy + dashed contributions line. */
  function niceStep(range, ticks) {
    var raw = range / Math.max(1, ticks), mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  }
  function drawBacktestChart(el, strategies) {
    if (!el || !strategies.length) return;
    var data = strategies.map(function (s) { return { name: s.name, color: s.color, pts: s.series }; });
    var contrib = strategies[0].series.map(function (p) { return { t: p.t, v: p.c }; });
    function draw() {
      var W = Math.max(280, el.clientWidth || 600), H = W < 520 ? 240 : 300;
      var L = 52, R = W < 520 ? 12 : 120, T = 12, B = 28;
      var pw = W - L - R, ph = H - T - B;
      var t0 = contrib[0].t, t1 = contrib[contrib.length - 1].t;
      var vmax = 0;
      data.forEach(function (d) { d.pts.forEach(function (p) { if (p.v > vmax) vmax = p.v; }); });
      contrib.forEach(function (p) { if (p.v > vmax) vmax = p.v; });
      var step = niceStep(vmax, 4), ymax = Math.ceil(vmax / step) * step || 1;
      function x(t) { return L + (t1 === t0 ? 0 : (t - t0) / (t1 - t0) * pw); }
      function y(v) { return T + (1 - v / ymax) * ph; }
      var stride = Math.max(1, Math.floor(contrib.length / Math.max(200, pw)));
      function path(pts) {
        var s = '';
        for (var i = 0; i < pts.length; i += stride) s += (s ? 'L' : 'M') + x(pts[i].t).toFixed(1) + ' ' + y(pts[i].v).toFixed(1);
        var last = pts[pts.length - 1];
        return s + 'L' + x(last.t).toFixed(1) + ' ' + y(last.v).toFixed(1);
      }
      var s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="שווי התיק לאורך זמן לפי אסטרטגיה" style="direction:ltr">';
      for (var v = 0; v <= ymax + 1e-9; v += step) {
        s += '<line x1="' + L + '" x2="' + (L + pw) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--grid)" stroke-width="1"/>';
        s += '<text x="' + (L - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">' + fmtCompact(v) + '</text>';
      }
      var y0 = new Date(t0).getUTCFullYear(), y1 = new Date(t1).getUTCFullYear();
      var every = Math.max(1, Math.ceil((y1 - y0 + 1) / Math.max(2, Math.floor(pw / 70))));
      for (var yr = y0 + 1; yr <= y1; yr++) {
        if ((yr - y0) % every) continue;
        var tx = x(Date.UTC(yr, 0, 1));
        if (tx < L || tx > L + pw) continue;
        s += '<line x1="' + tx + '" x2="' + tx + '" y1="' + (T + ph) + '" y2="' + (T + ph + 4) + '" stroke="var(--axis)"/>';
        s += '<text x="' + tx + '" y="' + (T + ph + 17) + '" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">' + yr + '</text>';
      }
      s += '<line x1="' + L + '" x2="' + (L + pw) + '" y1="' + (T + ph) + '" y2="' + (T + ph) + '" stroke="var(--axis)"/>';
      s += '<path d="' + path(contrib) + '" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>';
      data.forEach(function (d) { s += '<path d="' + path(d.pts) + '" fill="none" stroke="' + d.color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'; });
      if (R > 60) {
        var ends = data.map(function (d) { return { name: d.name, color: d.color, y: y(d.pts[d.pts.length - 1].v) }; }).sort(function (a, b) { return a.y - b.y; });
        for (var k = 1; k < ends.length; k++) if (ends[k].y - ends[k - 1].y < 14) ends[k].y = ends[k - 1].y + 14;
        ends.forEach(function (e) {
          s += '<circle cx="' + (L + pw) + '" cy="' + e.y + '" r="3" fill="' + e.color + '"/>';
          s += '<text x="' + (L + pw + 8) + '" y="' + (e.y + 4) + '" font-size="11" fill="var(--ink-2)" font-family="IBM Plex Sans Hebrew, system-ui, sans-serif">' + esc(e.name.length > 16 ? e.name.slice(0, 15) + '…' : e.name) + '</text>';
        });
      }
      s += '<line class="xh" x1="0" x2="0" y1="' + T + '" y2="' + (T + ph) + '" stroke="var(--ink-2)" stroke-width="1" visibility="hidden"/>';
      s += '<rect class="hit" x="' + L + '" y="' + T + '" width="' + pw + '" height="' + ph + '" fill="transparent"/>';
      s += '</svg><div class="tip" hidden></div>';
      el.innerHTML = s;
      var svg = $('svg', el), tip = $('.tip', el), xh = $('.xh', el), hit = $('.hit', el);
      function onMove(ev) {
        var rect = svg.getBoundingClientRect();
        var px = (ev.clientX - rect.left) * (W / rect.width);
        if (px < L || px > L + pw) { hide(); return; }
        var t = t0 + (px - L) / pw * (t1 - t0);
        var lo = 0, hi = contrib.length - 1;
        while (hi - lo > 1) { var mid = (lo + hi) >> 1; if (contrib[mid].t < t) lo = mid; else hi = mid; }
        var i = (t - contrib[lo].t) < (contrib[hi].t - t) ? lo : hi;
        var cx = x(contrib[i].t);
        xh.setAttribute('x1', cx); xh.setAttribute('x2', cx); xh.setAttribute('visibility', 'visible');
        var rowsH = data.map(function (d) { return { n: d.name, c: d.color, v: d.pts[i].v }; }).sort(function (a, b) { return b.v - a.v; });
        tip.innerHTML = '<div class="t">' + fmtDate(isoUTC(contrib[i].t)) + '</div>' + rowsH.map(function (r) {
          return '<div class="r"><span><i class="sw" style="background:' + r.c + '"></i> ' + esc(r.n) + '</span><span class="data">' + fmt(r.v, 0) + '</span></div>';
        }).join('') + '<div class="r muted"><span><i class="sw dash"></i> הפקדות</span><span class="data">' + fmt(contrib[i].v, 0) + '</span></div>';
        tip.hidden = false;
        var tw = tip.offsetWidth, left = cx * (rect.width / W) + 12;
        if (left + tw > rect.width) left = cx * (rect.width / W) - tw - 12;
        tip.style.left = Math.max(0, left) + 'px'; tip.style.top = '8px';
      }
      function hide() { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); }
      hit.addEventListener('pointermove', onMove);
      hit.addEventListener('pointerdown', onMove);
      hit.addEventListener('pointerleave', hide);
    }
    draw();
    if (!el.__ro && window.ResizeObserver) {
      var lastW = el.clientWidth;
      el.__ro = new ResizeObserver(function () { if (Math.abs(el.clientWidth - lastW) > 4) { lastW = el.clientWidth; draw(); } });
      el.__ro.observe(el);
    }
  }

    var plan = $('#pfPlan');
    if (plan) {
      var P = contributionPlan(pf, pf.contribution);
      if (!isNum(pf.contribution) || pf.contribution <= 0) plan.innerHTML = '<p class="muted small">הזן סכום כדי לראות הצעת חלוקה.</p>';
      else if (!P) plan.innerHTML = '<ul class="notes">' + noteHTML('warn', 'צריך משקלי יעד להחזקות כדי לחלק את ההפקדה.') + '</ul>';
      else plan.innerHTML = (P.normalized ? '<ul class="notes">' + noteHTML('info', 'משקלי היעד נורמלו ל-100% לצורך החישוב.') + '</ul>' : '') +
        '<div class="table-wrap"><table><thead><tr><th>החזקה</th><th class="num">לקנות</th></tr></thead><tbody>' +
        P.plan.map(function (x) { return '<tr><td>' + esc(x.h.ticker || x.h.name || '—') + '</td><td class="num data">' + fmtMoney(x.buy, cur) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    }
    var proj = $('#pfProjection');
    if (proj) {
      if (!isNum(pf.assumedReturn)) { proj.innerHTML = '<p class="muted small">הזן הנחת תשואה שנתית כדי להריץ את הסימולציה.</p>'; }
      else {
        var rs = [pf.assumedReturn - 2, pf.assumedReturn, pf.assumedReturn + 2];
        proj.innerHTML = '<div class="table-wrap"><table><thead><tr><th>הנחת תשואה</th><th class="num">שווי מדומה ב-' + fmtDate(pf.targetDate) + '</th><th class="num">סך ההפקדות</th></tr></thead><tbody>' +
          rs.map(function (r, i) {
            var F = projectFV(c.total, pf.monthly, r, months);
            return '<tr' + (i === 1 ? ' style="font-weight:700"' : '') + '><td class="data">' + fmtPct(r, 1) + (i === 1 ? ' (ההנחה שלך)' : '') + '</td><td class="num data">' + (F ? fmtMoney(F.fv, cur) : '—') +
              '</td><td class="num data">' + (F ? fmtMoney(F.paid, cur) : '—') + '</td></tr>';
          }).join('') + '</tbody></table></div><p class="muted small">שורות ±2% מראות רגישות להנחה. מבוסס על השווי הנוכחי (' + fmtMoney(c.total, cur) + '), ‏' + fmt(months, 0) + ' חודשים והפקדה חודשית של ' + fmtMoney(pf.monthly || 0, cur) + '.</p>';
      }
    }
  }

  /* =====================================================================
     12. Dashboard view
     ===================================================================== */
  RENDER.dashboard = function (sec) {
    var pf = state.portfolio, c = portfolioCalc(pf), months = monthsUntil(pf.targetDate);
    var scored = state.assets.map(scoreAsset);
    var html = '<header class="view-head"><p class="eyebrow">QD FUSION</p><h1 id="h-dashboard">לוח בקרה</h1>' +
      '<p class="lede">תמונת מצב של התיק, של ציוני הנכסים ושל מה שדורש תשומת לב. כל מספר כאן הוזן על ידך. האפליקציה לא מושכת נתוני שוק ולא משלימה נתונים חסרים.</p></header>';
    html += '<section class="card" aria-labelledby="h-d-pf"><div class="card-head"><h2 id="h-d-pf">תיק איתמר 2040</h2><a href="#portfolio" data-nav="portfolio" class="btn sm ghost">לתיק</a></div>';
    if (!c.count) html += '<div class="empty"><p>עדיין אין החזקות בתיק.</p><a class="btn primary" href="#portfolio" data-nav="portfolio">הוסף החזקות</a></div>';
    else html += '<div class="kpis">' + kpi('שווי כולל', '<span class="data">' + fmtMoney(c.total, pf.currency) + '</span>', c.count + ' החזקות') +
      kpi('זמן עד היעד', months == null ? '—' : fmt(months / 12, 1) + ' שנים', fmtDate(pf.targetDate)) +
      kpi('סטייה מרבית מיעד', (function () { var m = null; c.rows.forEach(function (r) { if (r.drift != null && (m == null || Math.abs(r.drift) > Math.abs(m))) m = r.drift; }); return m == null ? '—' : fmtPctSigned(m, 1); })(), 'נקודות אחוז') +
      kpi('ההחזקה הגדולה', c.max ? fmtPct(c.max.actual, 1) : '—', c.max ? esc(c.max.h.ticker || c.max.h.name || '') : '') + '</div>';
    html += '</section>';

    html += '<section class="card" aria-labelledby="h-d-alerts"><h2 id="h-d-alerts">דורש תשומת לב</h2><ul class="notes">' + alertsHTML(scored, c) + '</ul></section>';

    html += '<section class="card" aria-labelledby="h-d-scores"><div class="card-head"><h2 id="h-d-scores">ציוני נכסים</h2><a href="#scoring" data-nav="scoring" class="btn sm ghost">למנועי הציון</a></div>';
    if (!scored.length) html += '<div class="empty"><p>אין נכסים מדורגים.</p><a class="btn primary" href="#scoring" data-nav="scoring">הוסף נכס</a></div>';
    else {
      html += '<div class="grid-2"><div class="table-wrap"><table><thead><tr><th>נכס</th><th class="num">הזדמנות</th><th class="num">סיכון</th><th class="num">כיסוי</th><th>החלטה</th></tr></thead><tbody>' +
        scored.map(function (S) {
          var cov = Math.min(S.o.coverage, S.r.coverage);
          return '<tr class="clickable" data-nav="scoring" data-asset="' + esc(S.asset.id) + '" tabindex="0"><td>' + esc(S.asset.name) + (S.asset.demo ? ' <span class="chip demo">מדומה</span>' : '') +
            (S.asset.ticker ? '<div class="muted small data">' + esc(S.asset.ticker) + '</div>' : '') + '</td>' +
            '<td class="num data">' + (S.o.score == null ? '—' : fmt(S.o.score, 0)) + '</td><td class="num data">' + (S.r.score == null ? '—' : fmt(S.r.score, 0)) + '</td>' +
            '<td class="num data">' + fmtPct(cov * 100, 0) + '</td><td>' + toneChip(S.d) + '</td></tr>';
        }).join('') + '</tbody></table></div><div class="matrix-wrap">' + matrixSVG(scored, state.activeAssetId) + '</div></div>' +
        '<p class="muted small">עיגול מלא = ציון אמין. עיגול חלול = כיסוי נתונים נמוך. הקש על שורה כדי לערוך את הנכס.</p>';
    }
    html += '</section>';

    html += settingsCardHTML();
    sec.innerHTML = html;
    bindDashboard(sec);
  };
  function alertsHTML(scored, c) {
    var items = [];
    if (!Store.available) items.push(noteHTML('error', 'הדפדפן חוסם שמירה מקומית, ולכן הנתונים יימחקו כשתסגור את הדף. פתח את האפליקציה ישירות ב-Safari (לא בתצוגה מקדימה), או גבה את הנתונים בעזרת "העתק גיבוי".'));
    var missingMk = MARKET_KEYS.filter(function (k) { return !isNum(state.market[k]); });
    var realAssets = scored.filter(function (S) { return !S.asset.demo; });
    if (realAssets.length && missingMk.length) items.push(noteHTML('warn', 'חסרים נתוני שוק: ' + missingMk.map(function (k) { return esc(IND[k].label); }).join(', ') + '. <a href="#scoring" data-nav="scoring">להזנה</a>'));
    if (realAssets.length && !state.marketAsOf) items.push(noteHTML('info', 'לא צוין תאריך לנתוני השוק.'));
    else if (state.marketAsOf) { var dd = daysBetweenISO(state.marketAsOf, todayISO()); if (dd != null && dd > 7) items.push(noteHTML('warn', 'נתוני השוק בני ' + dd + ' ימים.')); }
    scored.forEach(function (S) {
      if (S.asset.demo) return;
      var cov = Math.min(S.o.coverage, S.r.coverage);
      if (!(S.o.reliable && S.r.reliable)) items.push(noteHTML('warn', esc(S.asset.name) + ': כיסוי נתונים ' + fmtPct(cov * 100, 0) + '. הציון אינו אמין. <a href="#scoring" data-nav="scoring" data-asset="' + esc(S.asset.id) + '">להשלמה</a>'));
      else if (S.d.key === 'Q1' || S.d.key === 'Q3') items.push(noteHTML(S.d.key === 'Q1' ? 'good' : 'error', esc(S.asset.name) + ': ' + esc(S.d.label) + '. ' + esc(S.d.text)));
    });
    if (c.count && Math.abs(c.targetSum - 100) > 0.5) items.push(noteHTML('warn', 'משקלי היעד בתיק מסתכמים ל-' + fmtPct(c.targetSum, 1) + ' ולא ל-100%.'));
    c.rows.forEach(function (r) { if (r.drift != null && Math.abs(r.drift) > 5) items.push(noteHTML('warn', esc(r.h.ticker || r.h.name || 'החזקה') + ' סוטה מהיעד ב-' + fmtPctSigned(r.drift, 1) + '.')); });
    if (scored.some(function (S) { return S.asset.demo; })) items.push(noteHTML('info', 'נכס ההדגמה מכיל ערכים מדומים להמחשה בלבד. אפשר למחוק אותו במסך מנועי הציון.'));
    if (!items.length) items.push(noteHTML('good', 'אין התראות פתוחות.'));
    return items.join('');
  }
  function settingsCardHTML() {
    return '<section class="card" aria-labelledby="h-d-set"><h2 id="h-d-set">הגדרות ונתונים</h2>' +
      '<div class="form-grid"><div class="field"><label for="setOppHi">סף הזדמנות להחלטה</label>' + numInput('setOppHi', state.settings.oppHi, { field: 'oppHi' }) + '</div>' +
      '<div class="field"><label for="setRiskHi">סף סיכון להחלטה</label>' + numInput('setRiskHi', state.settings.riskHi, { field: 'riskHi' }) + '</div></div>' +
      '<p class="muted small">' + (Store.available ? 'הנתונים נשמרים רק בדפדפן הזה, במכשיר הזה. ב-iPhone, אפליקציה שהוספת למסך הבית שומרת נתונים בנפרד מ-Safari. כדי להעביר נתונים בין מכשירים או לגבות אותם, השתמש בגיבוי.' : 'השמירה המקומית חסומה כאן. גבה את הנתונים לפני שתסגור את הדף.') + '</p>' +
      '<div class="row"><button type="button" class="btn" data-action="copy-backup">העתק גיבוי</button><button type="button" class="btn" data-action="dl-backup">הורד קובץ גיבוי</button>' +
      '<label class="btn file-label">ייבוא מקובץ<input id="importFile" type="file" accept=".json,application/json,text/plain" aria-label="ייבוא גיבוי מקובץ"></label></div>' +
      '<textarea id="backupOut" class="textarea" hidden readonly aria-label="טקסט הגיבוי"></textarea>' +
      '<details class="more"><summary>ייבוא מטקסט</summary><div class="stack"><label class="sr-only" for="importText">טקסט גיבוי</label><textarea id="importText" class="textarea" placeholder="{&quot;v&quot;:1,…}"></textarea>' +
      '<div class="row"><button type="button" class="btn" data-action="import-text">ייבא</button></div></div></details>' +
      '<p class="muted small">ייבוא מחליף את כל הנתונים הנוכחיים.</p>' +
      '<div class="row"><button type="button" class="btn danger" data-action="reset-all">מחק את כל הנתונים</button></div></section>';
  }
  function importBackup(text) {
    var obj;
    try { obj = JSON.parse(text); } catch (e) { toast('הטקסט אינו JSON תקין'); return false; }
    if (!obj || obj.v !== 1 || !Array.isArray(obj.assets) || !obj.portfolio) { toast('זה לא קובץ גיבוי של QD FUSION'); return false; }
    state = mergeDefaults(defaultState(), obj);
    state.seededDemo = true;
    migrateState();
    btRebuild();
    persist(true);
    toast('הגיבוי יובא');
    return true;
  }
  function bindDashboard(sec) {
    if (sec.__bound) return;
    sec.__bound = true;
    sec.addEventListener('input', function (e) {
      var f = e.target.getAttribute('data-field');
      if (f !== 'oppHi' && f !== 'riskHi') return;
      var v = parseNum(e.target.value), ok = isNum(v) && v > 0 && v < 100;
      e.target.setAttribute('aria-invalid', ok ? 'false' : 'true');
      if (ok) { state.settings[f] = v; persist(); }
    });
    sec.addEventListener('change', function (e) {
      var f = e.target.getAttribute('data-field');
      if (f === 'oppHi' || f === 'riskHi') { RENDER.dashboard(sec); return; }
      if (e.target.id === 'importFile') {
        readFile(e.target.files && e.target.files[0], function (text) { if (importBackup(text)) RENDER.dashboard(sec); });
      }
    });
    sec.addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-nav]')) { e.preventDefault(); e.target.click(); }
    });
    sec.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('[data-action]') : null;
      if (!b) return;
      var act = b.getAttribute('data-action');
      var json = function () { return JSON.stringify(state, null, 1); };
      if (act === 'copy-backup') copyText(json(), 'הגיבוי הועתק. שמור אותו בפתקים או בקובץ.', $('#backupOut', sec));
      else if (act === 'dl-backup') downloadText(json(), 'qd-fusion-backup-' + todayISO() + '.json', 'application/json');
      else if (act === 'import-text') { if (importBackup($('#importText', sec).value)) RENDER.dashboard(sec); }
      else if (act === 'reset-all') armOrRun(b, function () {
        state = defaultState(); state.seededDemo = true; btRebuild();
        persist(true); RENDER.dashboard(sec); toast('כל הנתונים נמחקו');
      }, 'לחץ שוב כדי למחוק הכול');
    });
  }

  /* =====================================================================
     13. Boot
     ===================================================================== */
  updateStorageBadge();
  getDownloads();
  if (!Store.available) showBanner('הדפדפן חוסם שמירה מקומית (למשל בתצוגה מקדימה או בגלישה פרטית). האפליקציה עובדת, אבל הנתונים לא יישמרו אחרי סגירת הדף.');
  persist();
  show(viewFromHash(), { keepScroll: true });
})();
</script>
</body>
</html>
